# prodject_tomogoch_II/docker-compose.yml — поднятие backend + postgres + frontend  # (я добавил)

services:
  db:
    image: postgres:16
    container_name: tamagochi_db
    environment:
      POSTGRES_DB: tamagochi
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tamagochi"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tamagochi_backend
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"  # (я добавил)
    command: ["poetry", "run", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  frontend: # (я добавил)
    build: # (я добавил)
      context: ./frontend # (я добавил)
      dockerfile: Dockerfile # (я добавил)
    container_name: tamagochi_frontend # (я добавил)
    ports: # (я добавил)
      - "5173:5173" # (я добавил)
    environment: # (я добавил)
      - VITE_API_BASE_URL=http://localhost:8000 # (я добавил)
    volumes: # (я добавил)
      - ./frontend:/app # (я добавил)
      - /app/node_modules # (я добавил)
    depends_on: # (я добавил)
      - backend # (я добавил)

volumes:
  db_data:
