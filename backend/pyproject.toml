# backend/pyproject.toml — зависимости и инструменты backend
# Назначение: управление зависимостями FastAPI (Poetry)

[tool.poetry]
name = "tamagotchi-backend"
version = "0.1.0"
description = "AI tamagotchi backend"
authors = ["Your Name <you@example.com>"]
package-mode = false  # (я добавил)

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
fastapi = "^0.110.3"
uvicorn = { extras = ["standard"], version = "^0.29.0" }
sqlalchemy = "^2.0.46"
asyncpg = "^0.29.0"
alembic = "^1.18.3"
pydantic-settings = "^2.12.0"
pyjwt = "^2.11.0"
passlib = { extras = ["bcrypt"], version = "^1.7.4" }
python-dotenv = "^1.2.1"
typer = "^0.12.3"
psycopg = { extras = ["binary"], version = "^3.2.0" }  # (я добавил)
email-validator = "^2.1.1"
bcrypt = "3.2.2"
httpx = "^0.28.1"

[tool.poetry.group.dev.dependencies]
ruff = "^0.6.9"
mypy = "^1.19.1"
httpx = "^0.28.1"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
